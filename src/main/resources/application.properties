# ---------------------------------------------------------------
# StockSim default configuration. Do NOT put real passwords here.
# Override any key in one of these (later entries win):
#   1. ~/.stocksim/stocksim.properties
#   2. ./stocksim.local.properties          (git-ignored)
#   3. environment: STOCKSIM_DB_URL, STOCKSIM_DB_USER, STOCKSIM_DB_PASSWORD, STOCKSIM_CSV_PATH
#   4. JVM system properties, e.g. -Ddb.password=...
# ---------------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/stocksim?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
db.user=root
db.password=

# Historical price CSV (Kaggle "stocks_df.csv"), read once into an empty database.
# Leave empty to use data/stocks_df.csv in the project folder if it is there.
# Without a file, clearly labelled SYNTHETIC sample data is generated instead.
csv.path=

sim.starting.balance=100000.00
# First simulation day for a new account; earlier days provide chart and indicator history.
sim.start.day=261

# Educational concentration thresholds (percent of current holdings value)
risk.stock.elevated=25
risk.stock.high=40
risk.sector.elevated=40
risk.sector.high=60

export.dir=reports
snapshot.file=simulation_state.ser
